name: Release

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Existing signed release tag to stage or publish"
        required: true
        type: string
      publish:
        description: "Publish the verified private draft"
        required: false
        type: boolean
        default: false
      expected_wheel_sha256:
        description: "Reviewed comma-separated wheel SHA-256 values"
        required: false
        type: string
      expected_sdist_sha256:
        description: "Reviewed sdist SHA-256"
        required: false
        type: string
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing signed release tag to stage or publish"
        required: true
        type: string
      publish:
        description: "Publish the verified private draft to TestPyPI, PyPI, and GitHub"
        required: false
        type: boolean
        default: false
      expected_wheel_sha256:
        description: "Reviewed comma-separated SHA-256 values for staged wheels (required when publishing)"
        required: false
        type: string
      expected_sdist_sha256:
        description: "Reviewed SHA-256 of the staged sdist (required when publishing)"
        required: false
        type: string

permissions: {}

env:
  VOIAGE_PYTHON_ABI: cp312-abi3

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-tag:
    name: Resolve immutable release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    outputs:
      tag_sha: ${{ steps.tag.outputs.tag_sha }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
      python_version: ${{ steps.version.outputs.python_version }}
    steps:
      - name: Check out repository for tag resolution
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve and validate exact signed remote release tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_TAGGER_EMAIL: ${{ vars.RELEASE_TAGGER_EMAIL }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          remote_oid="$(git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG" | cut -f1)"
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG")" = "$remote_oid"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          tag_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          git checkout --detach "$tag_sha"
          test "$(git rev-parse HEAD)" = "$tag_sha"
          test -n "$APPROVED_TAGGER_EMAIL"
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/$remote_oid" > tag-verification.json
          jq -e '.verification.verified == true' tag-verification.json >/dev/null
          test "$(jq -r '.tagger.email' tag-verification.json)" = "$APPROVED_TAGGER_EMAIL"
          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"
          if [[ "${RELEASE_TAG#v}" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compare C ABI with the v2.1.0 release baseline
        run: >-
          python3 scripts/check_abi_compatibility.py
          --baseline specs/abi/releases/v2.1.0
          --candidate-header rust/crates/voiage-ffi/include/voiage_v1.h
          --candidate-symbols specs/abi/v1/symbols.txt
          --candidate-layouts specs/abi/v1/layouts.txt
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.12.7"
          enable-cache: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.85"
      - name: Install locked validation tooling
        run: uv sync --locked --extra ci
      - name: Fail closed on release version
        id: version
        shell: bash
        run: |
          uv run --no-sync python -m voiage.versioning --release-tag "$RELEASE_TAG"
          python_version="$(
            uv run --no-sync python -m voiage.versioning \
              --release-tag "$RELEASE_TAG" \
              --print-python-version
          )"
          test -n "$python_version"
          echo "python_version=$python_version" >> "$GITHUB_OUTPUT"

  full-release-validation:
    name: Non-sharded full release validation
    needs: resolve-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      TAG_SHA: ${{ needs.resolve-tag.outputs.tag_sha }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.resolve-tag.outputs.tag_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable checkout
        run: test "$(git rev-parse HEAD)" = "$TAG_SHA"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.12.7"
          enable-cache: false
      - name: Set up supported Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - name: Install the immutable release environment
        run: uv sync --frozen --extra ci
      - name: Run fresh non-sharded full coverage gate
        run: >-
          uv run --frozen --no-sync pytest tests/
          --cov=voiage --cov-config=pyproject.toml
          --cov-report=term-missing --cov-fail-under=90

  wheels:
    name: Native wheel (${{ matrix.platform }})
    needs: resolve-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      TAG_SHA: ${{ needs.resolve-tag.outputs.tag_sha }}
      VOIAGE_SOURCE_REVISION: ${{ needs.resolve-tag.outputs.tag_sha }}
      VOIAGE_SOURCE_CLEAN: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            platform-suffix: manylinux_2_17_x86_64.manylinux2014_x86_64
            compatibility: manylinux2014
          - os: macos-14
            platform: macos-arm64
            platform-suffix: macosx_11_0_arm64
            compatibility: pypi
          - os: windows-2025
            platform: windows-x86_64
            platform-suffix: win_amd64
            compatibility: pypi
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.resolve-tag.outputs.tag_sha }}
          persist-credentials: false
      - name: Bind build to immutable source tree
        run: echo "VOIAGE_SOURCE_TREE_GIT_OID=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
      - name: Verify immutable checkout
        run: test "$(git rev-parse HEAD)" = "$TAG_SHA"
      - name: Record reproducible source epoch
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.12.7"
          enable-cache: false
      - name: Set up Python 3.12 ABI floor
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.85"
      - name: Install locked release tooling
        run: uv sync --locked --extra ci
      - name: Build native abi3 wheel
        if: runner.os != 'Linux'
        run: uv run --no-sync maturin build --locked --release --compatibility "${{ matrix.compatibility }}" --interpreter python --out dist
      - name: Build native manylinux2014 abi3 wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          args: --locked --release --compatibility pypi --interpreter python3.12 --out dist
          command: build
          docker-options: -e VOIAGE_SOURCE_REVISION -e VOIAGE_SOURCE_TREE_GIT_OID -e VOIAGE_SOURCE_CLEAN -e SOURCE_DATE_EPOCH
          manylinux: "2014"
          maturin-version: v1.14.1
          rust-toolchain: "1.85"
      - name: Verify wheel tag and native module
        env:
          WHEEL_PLATFORM: ${{ matrix.platform }}
          EXPECTED_PLATFORM_SUFFIX: ${{ matrix.platform-suffix }}
        run: |
          python -c "import os; from pathlib import Path; wheel=next(Path('dist').glob('*.whl')); assert os.environ['VOIAGE_PYTHON_ABI'] in wheel.name, wheel; expected=os.environ['EXPECTED_PLATFORM_SUFFIX']; platform=wheel.stem.rsplit('-', 1)[-1]; assert platform.endswith(expected), f'{os.environ[\"WHEEL_PLATFORM\"]}: {platform=} {expected=}'"
          python -c "from pathlib import Path; from zipfile import ZipFile; wheel=next(Path('dist').glob('*.whl')); assert any(name.startswith('voiage/_core.') for name in ZipFile(wheel).namelist())"
      - name: Install wheel into clean environment
        run: |
          uv venv --python 3.12 .release-wheel-venv
          uv pip install --python .release-wheel-venv dist/*.whl
          uv pip check --python .release-wheel-venv
          uv pip install --python .release-wheel-venv pytest rfc8785==0.1.4
          mkdir -p "$RUNNER_TEMP/wheel-black-box"
          cp "$GITHUB_WORKSPACE/tests/packaging/test_wheel_black_box.py" "$RUNNER_TEMP/wheel-black-box/"
      - name: Exercise wheel outside checkout
        env:
          WHEEL_VENV: ${{ github.workspace }}/.release-wheel-venv
          EXPECTED_SOURCE_REVISION: ${{ needs.resolve-tag.outputs.tag_sha }}
          EXPECTED_SOURCE_TREE_GIT_OID: ${{ env.VOIAGE_SOURCE_TREE_GIT_OID }}
          EXPECTED_PLATFORM_SUFFIX: ${{ matrix.platform-suffix }}
        run: cd "$RUNNER_TEMP/wheel-black-box" && uv run --python "$WHEEL_VENV" --no-project pytest test_wheel_black_box.py --import-mode=importlib
      - name: Record architecture manifest
        run: python -c "from pathlib import Path; wheel=next(Path('dist').glob('*.whl')); Path('dist/wheel-manifest-${{ matrix.platform }}.txt').write_text(wheel.name + '\n', encoding='utf-8')"
      - name: Upload native wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: voiage-wheel-${{ matrix.platform }}
          path: |
            dist/*.whl
            dist/wheel-manifest-${{ matrix.platform }}.txt
          if-no-files-found: error
          retention-days: 7

  sdist:
    name: Source distribution contract
    needs: resolve-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      TAG_SHA: ${{ needs.resolve-tag.outputs.tag_sha }}
      VOIAGE_SOURCE_REVISION: ${{ needs.resolve-tag.outputs.tag_sha }}
      VOIAGE_SOURCE_CLEAN: "true"
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.resolve-tag.outputs.tag_sha }}
          persist-credentials: false
      - name: Bind build to immutable source tree
        run: echo "VOIAGE_SOURCE_TREE_GIT_OID=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
      - name: Verify immutable checkout
        run: test "$(git rev-parse HEAD)" = "$TAG_SHA"
      - name: Record reproducible source epoch
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.12.7"
          enable-cache: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.85"
      - name: Install locked release tooling
        run: uv sync --locked --extra ci
      - name: Build source distribution
        run: |
          uv run --no-sync python scripts/embed_sdist_provenance.py
          uv run --no-sync maturin sdist --out dist
      - name: Extract clean source distribution
        run: |
          mkdir .sdist-source .sdist-wheel
          tar -xzf dist/*.tar.gz -C .sdist-source --strip-components=1
      - name: Reconcile extracted Rust lockfile
        working-directory: .sdist-source
        run: cargo generate-lockfile --manifest-path rust/Cargo.toml
      - name: Build manylinux2014 wheel from clean extracted sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          args: --locked --release --compatibility pypi --interpreter python3.12 --out ../.sdist-wheel
          command: build
          docker-options: -e SOURCE_DATE_EPOCH
          manylinux: "2014"
          maturin-version: v1.14.1
          rust-toolchain: "1.85"
          working-directory: .sdist-source
      - name: Verify sdist-derived wheel tag
        run: python -c "import os; from pathlib import Path; wheel=next(Path('.sdist-wheel').glob('*.whl')); assert os.environ['VOIAGE_PYTHON_ABI'] in wheel.name, wheel; assert wheel.stem.rsplit('-', 1)[-1].endswith('manylinux_2_17_x86_64.manylinux2014_x86_64'), wheel"
      - name: Install and smoke sdist-derived wheel
        env:
          WHEEL_VENV: ${{ github.workspace }}/.sdist-wheel-venv
          EXPECTED_SOURCE_REVISION: ${{ needs.resolve-tag.outputs.tag_sha }}
          EXPECTED_SOURCE_TREE_GIT_OID: ${{ env.VOIAGE_SOURCE_TREE_GIT_OID }}
          EXPECTED_PLATFORM_SUFFIX: manylinux_2_17_x86_64.manylinux2014_x86_64
        run: |
          uv venv --python 3.12 .sdist-wheel-venv
          uv pip install --python .sdist-wheel-venv .sdist-wheel/*.whl
          uv pip check --python .sdist-wheel-venv
          uv pip install --python .sdist-wheel-venv pytest rfc8785==0.1.4
          mkdir -p "$RUNNER_TEMP/sdist-black-box"
          cp tests/packaging/test_wheel_black_box.py "$RUNNER_TEMP/sdist-black-box/"
          cd "$RUNNER_TEMP/sdist-black-box"
          uv run --python "$WHEEL_VENV" --no-project pytest test_wheel_black_box.py --import-mode=importlib
      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: voiage-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  polyglot-sbom:
    name: Compose release-bound polyglot SBOM
    needs: [resolve-tag, wheels, sdist]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.resolve-tag.outputs.tag_sha }}
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.12.7"
          enable-cache: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - name: Generate resolved Python inventory
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt \
            --output-file release-requirements.txt
          uvx --from cyclonedx-bom==7.3.0 cyclonedx-py requirements \
            release-requirements.txt --output-reproducible --of JSON \
            -o python.sbom.cdx.json
      - name: Compose mixed-language CycloneDX inventory
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          TAG_SHA: ${{ needs.resolve-tag.outputs.tag_sha }}
        run: >-
          python scripts/compose_polyglot_sbom.py compose
          --python-sbom python.sbom.cdx.json
          --cargo-workspace rust
          --r-description r-package/voiageR/DESCRIPTION
          --julia-project bindings/julia/Project.toml
          --source-version "${RELEASE_TAG#v}"
          --source-commit "$TAG_SHA"
          --source-tag "$RELEASE_TAG"
          --output polyglot.sbom.cdx.json
      - name: Upload release-bound SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: voiage-polyglot-sbom
          path: polyglot.sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Validate and attest release artifacts
    needs: [resolve-tag, full-release-validation, wheels, sdist, polyglot-sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      TAG_SHA: ${{ needs.resolve-tag.outputs.tag_sha }}
      PYTHON_VERSION: ${{ needs.resolve-tag.outputs.python_version }}
      EXPECTED_NATIVE_ARCHITECTURES: linux-x86_64,macos-arm64,windows-x86_64
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-tag.outputs.tag_sha }}
          persist-credentials: false
      - name: Revalidate remote tag binding
        shell: bash
        run: |
          git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG"
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$TAG_SHA"
      - name: Download all release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: voiage-*
          path: dist
          merge-multiple: true
      - name: Validate complete extensible artifact set
        run: |
          python -c "import os; from pathlib import Path; version=os.environ['PYTHON_VERSION']; abi=os.environ['VOIAGE_PYTHON_ABI']; expected=set(os.environ['EXPECTED_NATIVE_ARCHITECTURES'].split(',')); wheels=list(Path('dist').glob('*.whl')); manifests=list(Path('dist').glob('wheel-manifest-*.txt')); actual={m.stem.removeprefix('wheel-manifest-') for m in manifests}; assert actual==expected, f'expected native architectures {expected}, found {actual}'; assert len(wheels)==len(manifests)>0, f'expected one wheel per architecture manifest: {wheels=} {manifests=}'; declared={m.read_text(encoding='utf-8').strip() for m in manifests}; assert declared=={w.name for w in wheels}; assert all(f'voiage-{version}-{abi}-' in w.name for w in wheels)"
          python -c "import os; from pathlib import Path; version=os.environ['PYTHON_VERSION']; sdists=list(Path('dist').glob('*.tar.gz')); assert len(sdists)==1, f'expected exactly one source distribution, found {sdists}'; assert sdists[0].name==f'voiage-{version}.tar.gz'"
      - name: Attest release artifacts
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: "dist/*"
      - name: Export detectable SLSA provenance
        shell: bash
        run: |
          test -s "$PROVENANCE_BUNDLE"
          cp "$PROVENANCE_BUNDLE" "dist/voiage-${PYTHON_VERSION}.intoto.jsonl"
          test -s "dist/voiage-${PYTHON_VERSION}.intoto.jsonl"
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
      - name: Bind polyglot SBOM to release subjects
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/polyglot.sbom.cdx.json
      - name: Create digest-bound release manifest
        shell: bash
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz polyglot.sbom.cdx.json | LC_ALL=C sort > SHA256SUMS
          python -c "import json, pathlib; rows=[line.split(maxsplit=1) for line in pathlib.Path('SHA256SUMS').read_text().splitlines()]; pathlib.Path('release-manifest.json').write_text(json.dumps({'schema_version':'1.0.0','source_commit':'${TAG_SHA}','artifacts':[{'sha256': digest, 'name': name.lstrip('*')} for digest, name in rows]}, sort_keys=True, indent=2)+'\n')"
      - name: Verify build-provenance subjects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://cyclonedx.org/bom
          done
      - name: Upload attested release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: voiage-attested-release
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.intoto.jsonl
            dist/polyglot.sbom.cdx.json
            dist/release-manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7


  stage:
    name: Build and Stage Private Draft
    needs: [resolve-tag, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      TAG_SHA: ${{ needs.resolve-tag.outputs.tag_sha }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-tag.outputs.tag_sha }}
          persist-credentials: false
      - name: Revalidate exact signed remote release tag
        shell: bash
        run: |
          git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG"
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$TAG_SHA"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
      - name: Download attested release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: voiage-attested-release
          path: dist
      - name: Create exact digest manifest
        shell: bash
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz | LC_ALL=C sort > SHA256SUMS
      - name: Create or refresh private draft release
        if: github.event_name != 'workflow_dispatch' || !inputs.publish
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
          else
            gh release create "$RELEASE_TAG" --draft --generate-notes --verify-tag --target "$TAG_SHA"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retain immutable publication payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-payload-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  reviewed-payload:
    name: Validate Reviewed Private Draft
    needs: [resolve-tag, stage]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Draft releases are visible only to tokens with push-level repository
      # access. Keep this elevation scoped to the digest-review job.
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Download reviewed private draft payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.whl' --pattern '*.tar.gz'
      - name: Require reviewed artifact digests and private draft
        shell: bash
        env:
          EXPECTED_WHEEL_SHA256: ${{ inputs.expected_wheel_sha256 }}
          EXPECTED_SDIST_SHA256: ${{ inputs.expected_sdist_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SDIST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name '*.whl' -print | LC_ALL=C sort)
          mapfile -t sdists < <(find dist -maxdepth 1 -type f -name '*.tar.gz' -print)
          test "${#wheels[@]}" -eq 3
          test "${#sdists[@]}" -eq 1
          actual_wheels="$(for wheel in "${wheels[@]}"; do sha256sum "$wheel" | cut -d ' ' -f1; done | paste -sd, -)"
          test "$actual_wheels" = "$EXPECTED_WHEEL_SHA256"
          test "$(sha256sum "${sdists[0]}" | cut -d ' ' -f1)" = "$EXPECTED_SDIST_SHA256"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
      - name: Upload reviewed release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-release-payload
          path: dist/
          if-no-files-found: error
          retention-days: 1

  test-pypi:
    name: Publish Reviewed Draft to TestPyPI
    needs: [resolve-tag, reviewed-payload]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      TAG_SHA: ${{ needs.resolve-tag.outputs.tag_sha }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-tag.outputs.tag_sha }}
          persist-credentials: false
      - name: Download reviewed release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: reviewed-release-payload
          path: dist
      - name: Revalidate remote tag binding immediately before TestPyPI
        shell: bash
        run: |
          git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG"
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$TAG_SHA"
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          verbose: true
          print-hash: true
          skip-existing: true
          attestations: true

  test-pypi-smoke:
    name: Install and smoke TestPyPI release
    needs: [resolve-tag, test-pypi]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      TAG_SHA: ${{ needs.resolve-tag.outputs.tag_sha }}
      PYTHON_VERSION: ${{ needs.resolve-tag.outputs.python_version }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.resolve-tag.outputs.tag_sha }}
          persist-credentials: false
      - name: Bind smoke test to immutable source tree
        run: echo "VOIAGE_SOURCE_TREE_GIT_OID=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.12.7"
          enable-cache: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Download reviewed release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: reviewed-release-payload
          path: reviewed-dist
      - name: Compare TestPyPI bytes with reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          expected_manifest="$RUNNER_TEMP/reviewed-testpypi-manifest"
          remote_manifest="$RUNNER_TEMP/remote-testpypi-manifest"
          release_json="$RUNNER_TEMP/testpypi-release.json"
          for distribution in reviewed-dist/*; do
            test -f "$distribution"
            printf '%s  %s\n' \
              "$(sha256sum "$distribution" | cut -d ' ' -f1)" \
              "$(basename "$distribution")"
          done | LC_ALL=C sort > "$expected_manifest"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error \
              "https://test.pypi.org/pypi/voiage/${PYTHON_VERSION}/json" \
              > "$release_json"; then
              jq -r '.urls[] | "\(.digests.sha256)  \(.filename)"' \
                "$release_json" | LC_ALL=C sort > "$remote_manifest"
              if cmp --silent "$expected_manifest" "$remote_manifest"; then
                break
              fi
            fi
            if [[ "$attempt" == "6" ]]; then
              echo "TestPyPI distribution set does not match the reviewed payload" >&2
              diff --unified "$expected_manifest" "$remote_manifest" || true
              exit 1
            fi
            sleep 20
          done
          mkdir testpypi-dist
          for attempt in 1 2 3 4 5 6; do
            if python -m pip download --no-deps --only-binary=:all: \
              --index-url https://test.pypi.org/simple/ \
              --dest testpypi-dist "voiage==$PYTHON_VERSION"; then
              break
            fi
            if [[ "$attempt" == "6" ]]; then
              echo "TestPyPI Simple API did not expose the reviewed release" >&2
              exit 1
            fi
            sleep 20
          done
          reviewed="$(find reviewed-dist -maxdepth 1 -name '*manylinux*x86_64.whl' -print -quit)"
          downloaded="$(find testpypi-dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$reviewed"
          test -n "$downloaded"
          test "$(sha256sum "$reviewed" | cut -d ' ' -f1)" = \
            "$(sha256sum "$downloaded" | cut -d ' ' -f1)"
      - name: Verify TestPyPI distribution attestations
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t distribution_urls < <(
            curl --fail --silent --show-error \
              "https://test.pypi.org/pypi/voiage/${PYTHON_VERSION}/json" |
              jq --exit-status --raw-output '.urls[].url'
          )
          test "${#distribution_urls[@]}" -eq 4
          for distribution_url in "${distribution_urls[@]}"; do
            filename="$(basename "$distribution_url")"
            test "$filename" != "."
            test "$filename" != ".."
            test -f "reviewed-dist/$filename"
            provenance="$RUNNER_TEMP/$filename.provenance"
            curl --fail --silent --show-error \
              "https://test.pypi.org/integrity/voiage/${PYTHON_VERSION}/${filename}/provenance" \
              --output "$provenance"
            uvx --from 'pypi-attestations==0.0.30' \
              pypi-attestations verify pypi \
              --provenance-file "$provenance" \
              --repository "https://github.com/${GITHUB_REPOSITORY}" \
              "reviewed-dist/$filename"
          done
      - name: Install TestPyPI artifact with bounded retry
        shell: bash
        run: |
          uv export --locked --extra ci --no-dev --no-emit-project --output-file locked-requirements.txt
          uv venv --python "${{ matrix.python }}" .testpypi-venv
          uv pip install --python .testpypi-venv -r locked-requirements.txt
          for attempt in 1 2 3 4 5 6; do
            if uv pip install --python .testpypi-venv --no-deps --refresh-package voiage --index-url https://test.pypi.org/simple/ "voiage==$PYTHON_VERSION"; then
              break
            fi
            if [[ "$attempt" == "6" ]]; then
              exit 1
            fi
            sleep 20
          done
          mkdir -p "$RUNNER_TEMP/testpypi-black-box"
          cp tests/packaging/test_wheel_black_box.py "$RUNNER_TEMP/testpypi-black-box/"
      - name: Smoke installed TestPyPI artifact outside checkout
        env:
          WHEEL_VENV: ${{ github.workspace }}/.testpypi-venv
          EXPECTED_SOURCE_REVISION: ${{ needs.resolve-tag.outputs.tag_sha }}
          EXPECTED_SOURCE_TREE_GIT_OID: ${{ env.VOIAGE_SOURCE_TREE_GIT_OID }}
          EXPECTED_PLATFORM_SUFFIX: manylinux_2_17_x86_64.manylinux2014_x86_64
        run: cd "$RUNNER_TEMP/testpypi-black-box" && uv run --python "$WHEEL_VENV" --no-project pytest test_wheel_black_box.py --import-mode=importlib

  pypi:
    name: Publish to PyPI
    needs: [resolve-tag, test-pypi-smoke]
    if: needs.resolve-tag.outputs.is_prerelease != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      TAG_SHA: ${{ needs.resolve-tag.outputs.tag_sha }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-tag.outputs.tag_sha }}
          persist-credentials: false
      - name: Download reviewed release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: reviewed-release-payload
          path: dist
      - name: Revalidate remote tag binding immediately before PyPI
        shell: bash
        run: |
          git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG"
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$TAG_SHA"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist/
          verbose: true
          print-hash: true
          attestations: true

  github-release:
    name: Publish verified GitHub Release
    needs: [resolve-tag, pypi]
    if: needs.resolve-tag.outputs.is_prerelease != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      TAG_SHA: ${{ needs.resolve-tag.outputs.tag_sha }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-tag.outputs.tag_sha }}
          persist-credentials: false
      - name: Revalidate remote tag binding
        shell: bash
        run: |
          git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG"
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$TAG_SHA"
      - name: Download attested release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: voiage-attested-release
          path: dist
      - name: Publish verified GitHub Release
        # The repository/organization should enable immutable releases so this
        # draft-first publication locks its tag and final asset set.
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
